services:
  anondoc:
    build: .
    container_name: anondoc-app
    userns_mode: "keep-id:uid=1001,gid=1001"
    ports:
      # Solo loopback del host. Para exponerlo use un reverse proxy con TLS y autenticación.
      - "127.0.0.1:8000:8000"
    environment:
      - ANONDOC_HOST=0.0.0.0 # dentro del contenedor; el acceso externo lo limita el mapeo de puertos
      - ANONDOC_PORT=8000
      - ANONDOC_DEBUG=false
      - ANONDOC_JOB_TTL=1800
      - ANONDOC_MAX_FILE_SIZE=104857600 # 100 MB
      - ANONDOC_MAX_PAGES=500
      - ANONDOC_WORKER_TIMEOUT=300
      - ANONDOC_WORKER_CPU=300
      - ANONDOC_WORKER_MEMORY=2147483648 # 2 GB
      - ANONDOC_WORKER_MAX_OUTPUT=52428800 # 50 MB
      - ANONDOC_RATE_LIMIT=600
      - ANONDOC_UPLOAD_RATE_LIMIT=100
      - ANONDOC_TEMP_DIR=/tmp/anondoc
      - ANONDOC_ENABLE_GLINER=true
      - ANONDOC_GLINER_TIMEOUT=1500
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - PYTHONPATH=/app:/venv_pkgs
    volumes:
      - ./anondoc:/app/anondoc:ro,Z
      - ./.venv/lib/python3.12/site-packages:/venv_pkgs:ro,Z
      - /home/chae/.cache/huggingface:/cache/huggingface:ro,Z
    # Los documentos solo viven en memoria RAM (tmpfs) y desaparecen al detener el contenedor.
    tmpfs:
      - /tmp/anondoc:rw,noexec,nosuid,nodev,size=512m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 10.0
    restart: unless-stopped
