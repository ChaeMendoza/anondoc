services:
  anondoc:
    build: .
    container_name: anondoc-app
    ports:
      # Solo loopback del host. Para exponerlo use un reverse proxy con TLS y autenticación.
      - "127.0.0.1:8000:8000"
    environment:
      - ANONDOC_HOST=0.0.0.0 # dentro del contenedor; el acceso externo lo limita el mapeo de puertos
      - ANONDOC_PORT=8000
      - ANONDOC_DEBUG=false
      - ANONDOC_JOB_TTL=1800
      - ANONDOC_MAX_FILE_SIZE=26214400 # 25 MB
      - ANONDOC_TEMP_DIR=/tmp/anondoc
    # Los documentos solo viven en memoria RAM (tmpfs) y desaparecen al detener el contenedor.
    tmpfs:
      - /tmp/anondoc:rw,noexec,nosuid,nodev,size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
